plugins {
    id 'com.android.application'
}

// Optional local overrides, kept out of git (see README): e.g. applicationId=com.example.tvhome
def local = new Properties()
def localFile = rootProject.file('defaults.properties')
if (localFile.exists()) localFile.withInputStream { local.load(it) }

android {
    namespace 'com.tvhome.launcher'
    compileSdk 35

    defaultConfig {
        applicationId local.getProperty('applicationId', 'com.tvhome.launcher')
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK can be sideloaded without a keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
